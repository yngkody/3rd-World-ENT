<script>
    // 3D Spatial Depth / Parallax Engine
    const artworkWrap = document.getElementById('spatial-artwork-wrap');
    const glareLayer = document.getElementById('spatial-glare-layer');
    const heroText = document.getElementById('spatial-hero-text');
    const gate = document.getElementById('entrance-gate');

    let targetX = 0;
    let targetY = 0;
    let currentX = 0;
    let currentY = 0;
    let animationFrameId = null;

    function handlePointerMove(e) {
      const { innerWidth: w, innerHeight: h } = window;
      const clientX = e.clientX ?? (e.touches && e.touches[0] ? e.touches[0].clientX : w / 2);
      const clientY = e.clientY ?? (e.touches && e.touches[0] ? e.touches[0].clientY : h / 2);

      // Normalized coordinates from -1 to 1
      targetX = (clientX / w - 0.5) * 2;
      targetY = (clientY / h - 0.5) * 2;
    }

    // Gyroscope / Device orientation support for mobile
    window.addEventListener('deviceorientation', (e) => {
      if (!e.gamma || !e.beta) return;
      const gamma = Math.min(Math.max(e.gamma, -30), 30);
      const beta = Math.min(Math.max(e.beta - 35, -30), 30);
      targetX = gamma / 30;
      targetY = beta / 30;
    });

    window.addEventListener('mousemove', handlePointerMove);
    window.addEventListener('touchmove', handlePointerMove, { passive: true });

    // Smooth Lerp Rendering Loop for 3D depth and specular reaction
    function render3DDepth() {
      currentX += (targetX - currentX) * 0.08;
      currentY += (targetY - currentY) * 0.08;

      const rotateY = currentX * 8;      // Balanced tilt
      const rotateX = -currentY * 7;     // Balanced pitch
      const panX = -currentX * 24;       // Horizontal parallax shift
      const panY = -currentY * 18;       // Vertical parallax shift

      if (artworkWrap) {
        artworkWrap.style.transform = `scale(1.04) translate3d(${panX}px, ${panY}px, 0) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
      }

      // Specular glare dynamic tracking
      if (glareLayer) {
        const glarePosX = 50 + (currentX * 35);
        const glarePosY = 50 + (currentY * 35);
        glareLayer.style.background = `radial-gradient(circle at ${glarePosX}% ${glarePosY}%, rgba(255,255,255,0.22) 0%, rgba(213,30,30,0.1) 35%, transparent 70%)`;
      }

      // Floating foreground text counter-parallax
      if (heroText) {
        const textPanX = currentX * 18;
        const textPanY = currentY * 14;
        heroText.style.transform = `translate3d(${textPanX}px, ${textPanY}px, 40px) rotateX(${rotateX * 0.35}deg) rotateY(${rotateY * 0.35}deg)`;
      }

      animationFrameId = requestAnimationFrame(render3DDepth);
    }
    render3DDepth();

    // Entrance Gate Controls
    function dismissEntrance() {
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      
      const img = document.getElementById('spatial-img');
      if (img) {
        img.style.transform = 'scale(1.15)';
        img.style.filter = 'brightness(0.3) blur(6px)';
      }
      
      gate.classList.add('opacity-0', 'pointer-events-none', 'scale-105');
      setTimeout(() => {
        gate.style.display = 'none';
      }, 900);
    }

    function showEntrance() {
      gate.style.display = 'flex';
      const img = document.getElementById('spatial-img');
      if (img) {
        img.style.transform = 'scale(1)';
        img.style.filter = 'contrast(1.04) brightness(0.96)';
      }
      setTimeout(() => {
        gate.classList.remove('opacity-0', 'pointer-events-none', 'scale-105');
        render3DDepth();
      }, 20);
    }

    // Cart Management
    let cart = [];

    function toggleCartDrawer() {
      const drawer = document.getElementById('cart-drawer');
      const panel = document.getElementById('cart-panel');
      if (drawer.classList.contains('opacity-0')) {
        drawer.classList.remove('opacity-0', 'pointer-events-none');
        panel.classList.remove('translate-x-full');
      } else {
        drawer.classList.add('opacity-0', 'pointer-events-none');
        panel.classList.add('translate-x-full');
      }
    }

    function addToCart(title, price, image) {
      cart.push({ title, price, image });
      updateCartUI();
      toggleCartDrawer();
    }

    function removeFromCart(index) {
      cart.splice(index, 1);
      updateCartUI();
    }

    function updateCartUI() {
      const counter = document.getElementById('cart-counter');
      const countLabel = document.getElementById('cart-item-count');
      const list = document.getElementById('cart-items-list');
      const emptyState = document.getElementById('cart-empty-state');
      const subtotalEl = document.getElementById('cart-subtotal');

      counter.innerText = cart.length;
      countLabel.innerText = `(${cart.length} ITEMS)`;

      if (cart.length === 0) {
        list.innerHTML = '';
        list.appendChild(emptyState);
        subtotalEl.innerText = '$0.00 USD';
        return;
      }

      let subtotal = 0;
      list.innerHTML = '';
      cart.forEach((item, index) => {
        subtotal += item.price;
        const itemEl = document.createElement('div');
        itemEl.className = 'flex items-center gap-4 bg-surface p-3 rounded-xl border border-white/10';
        itemEl.innerHTML = `
          <img src="${item.image}" class="w-16 h-16 object-cover rounded-lg">
          <div class="flex-1 font-mono">
            <h5 class="text-xs uppercase text-white font-bold leading-snug">${item.title}</h5>
            <p class="text-xs text-neutral-400">$${item.price}.00 USD</p>
          </div>
          <button onclick="removeFromCart(${index})" class="text-neutral-500 hover:text-red3rd p-1">
            <span class="material-symbols-outlined text-sm">delete</span>
          </button>
        `;
        list.appendChild(itemEl);
      });

      subtotalEl.innerText = `$${subtotal}.00 USD`;
    }

    // Audio Playback Equalizer Simulation
    let isPlaying = false;
    let eqInterval = null;

    function toggleAudio() {
      isPlaying = !isPlaying;
      const mainBtn = document.getElementById('main-play-btn');
      const playIcon = document.getElementById('main-play-icon');
      const navStatus = document.getElementById('nav-audio-status');
      const bars = document.querySelectorAll('#equalizer-bars div');

      if (isPlaying) {
        playIcon.innerText = 'pause';
        navStatus.innerText = 'PLAYING';
        eqInterval = setInterval(() => {
          bars.forEach(bar => {
            const randomH = Math.floor(Math.random() * 40) + 10;
            bar.style.height = `${randomH}px`;
          });
        }, 150);
      } else {
        playIcon.innerText = 'play_arrow';
        navStatus.innerText = 'ON AIR';
        clearInterval(eqInterval);
        bars.forEach((bar, i) => {
          bar.style.height = `${(i % 3 + 1) * 12}px`;
        });
      }
    }

    function openQuickView(id) {
      const data = quickViewData[id];
      if (!data) return;
      document.getElementById('qv-title').innerText = data.title;
      document.getElementById('qv-price').innerText = `$${data.price}.00 USD`;
      document.getElementById('qv-image').src = data.image;
      document.getElementById('qv-tag').innerHTML = data.tag;
      document.getElementById('qv-desc').innerText = data.desc;
      document.getElementById('qv-add-btn').onclick = () => {
        addToCart(data.title, data.price, data.image);
        closeQuickView();
      };
      document.getElementById('quickview-modal').classList.remove('hidden');
    }

    function closeQuickView() {
      document.getElementById('quickview-modal').classList.add('hidden');
    }

    // Dispatch form
